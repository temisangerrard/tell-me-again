<h1>Tell Me Again</h1>
<p>Tell Me Again is a free web app that helps families record and keep the stories of their parents, grandparents, siblings and partners. It suggests a good question for each person, records the answer on your phone, and turns the stories into a shared family history. Recordings stay on your device.</p>
<p>It needs JavaScript to run. Open <a href="https://tellagain.app/">tellagain.app</a> in Safari or Chrome with JavaScript on.</p>
