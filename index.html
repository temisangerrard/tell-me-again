<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tell Me Again</title>
<meta name="theme-color" content="#fbf5ec">
<link rel="manifest" href="manifest.json">
<script>try{var t=localStorage.getItem("sitting-theme");document.documentElement.dataset.theme=["white","warm","night"].includes(t)?t:"white"}catch(e){document.documentElement.dataset.theme="white"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · custom theme · warm light · family-chosen accent · Bricolage Grotesque + Barlow Condensed numerals + SF/Inter
 * paper #fbf5ec · ink #3b2a22 · accent chosen by the family (default terracotta) */
:root {
  --bg:#fcfcfa; --ink:#1d1d1f; --surface:#ffffff; --surface2:#f3f3f0; --line:#e5e5e0; --text:#1d1d1f; --muted:#6e6e73;
  --accent:#e26b3f; --on-accent:#2b1a12; --accent-text:color-mix(in srgb,var(--accent) 58%,var(--text)); --danger:#c0391b;
  --p-red:#d6453d; --p-green:#2f8f5b; --p-yellow:#f0b323; --p-blue:#2b64d9;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --t-fast:80ms; --t-mid:240ms; --t-slow:360ms; /* three speeds only: small moves, panels, large surfaces */
  --r-md:14px; --r-lg:20px; --shell:520px;
  --shadow:0 0 #0000; --scrim:#1d1d1f8c; --soft:#0000000f;
}
/* Themes: the whole app reads these tokens, so a theme is just a different set of values. */
:root[data-theme=warm] { --bg:#fbf5ec; --ink:#2b1a12; --surface:#fffdf9; --surface2:#f4eadb; --line:#e8dac6; --text:#3b2a22; --muted:#7a6556; --danger:#b4421f; --shadow:0 0 #0000; --scrim:#3b2a2299; --soft:#3b2a2214; }
:root[data-theme=night] { --bg:#0b0b0c; --ink:#0b0b0c; --surface:#151517; --surface2:#1f1f22; --line:#ffffff1f; --text:#f4f3e8; --muted:#a0a0a6; --danger:#ff9a7a; --shadow:0 0 0 #0000; --scrim:#000000b3; --soft:#ffffff14; }
* { box-sizing:border-box; }
html, body { overflow-x:clip; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
h1,h2,h3,p { margin:0; }
button { font:inherit; color:inherit; }
[hidden] { display:none !important; }
[tabindex="-1"]:focus { outline:0; }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.display { font-family:var(--display); font-weight:800;  line-height:.92; letter-spacing:.005em; overflow-wrap:anywhere; text-wrap:balance; }
h2.display { font-size:clamp(2.6rem,13vw,3.6rem); }
.sub { color:var(--muted); font-size:1.02rem; margin-top:14px; max-width:36ch; }
.kicker { font:600 .85rem var(--sans); color:var(--accent-text); }

/* shell */
.app { min-height:100vh; min-height:100dvh; width:min(100%,var(--shell)); margin:0 auto; display:flex; flex-direction:column; }
.app.room { --shell:720px; }
.screen { flex:1; display:flex; flex-direction:column; padding:max(12px,env(safe-area-inset-top)) 24px 0; }
.top { display:flex; align-items:center; gap:12px; min-height:48px; }
.back { width:44px; height:44px; margin-left:-12px; display:grid; place-items:center; background:none; border:0; border-radius:50%; cursor:pointer; flex:none; }
.back svg { width:22px; height:22px; }
.bar { flex:1; display:flex; gap:4px; }
.bar i { flex:1; height:3px; border-radius:3px; background:var(--line); }
.bar i.on { background:var(--accent); }
.content { flex:1; padding:28px 0 24px; }
.dock { position:sticky; bottom:0; padding:16px 0 max(20px,env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }

/* controls */
.cta { display:block; width:100%; min-height:56px; border:0; border-radius:999px; background:var(--accent); color:var(--on-accent); font:600 1.02rem var(--sans); cursor:pointer; }
.cta:disabled { opacity:.35; cursor:not-allowed; }
.btn, .chip, .pick, .sw, .tabbtn, .rec, .roll, .cta, .game { touch-action:manipulation; transition:transform var(--t-mid) var(--ease-out); }
.cta:not(:disabled):active, .chip:active, .pick:active, .sw:active, .btn:active, .roll:not(:disabled):active, .game:not(:disabled):active { transform:scale(.97); }
.rec:active { transform:scale(.95); }
.btn { min-height:44px; padding:10px 18px; border-radius:999px; border:0; background:var(--surface2); cursor:pointer; font-weight:500; }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.field { display:block; margin-top:28px; }
.lbl { display:block; font:600 .92rem var(--sans); color:var(--text); }
.lbl small { font-weight:400; font-size:.88rem; color:var(--muted); }
.hint { color:var(--muted); font-size:.9rem; margin-top:6px; }
.inp { width:100%; padding:10px 0 12px; font:600 1.7rem/1.2 var(--sans); letter-spacing:-.01em; background:transparent; color:var(--text); border:0; border-bottom:2px solid var(--line); border-radius:0; }
.inp::placeholder { color:color-mix(in srgb,var(--muted) 65%,transparent); font-weight:500; }
.inp:focus { outline:0; border-bottom-color:var(--accent); box-shadow:0 2px 0 0 var(--accent); }
textarea.inp { font-size:1.15rem; font-weight:500; resize:none; }
.inp.sm { font-size:1.15rem; font-weight:500; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.chip { min-height:44px; padding:10px 18px; border-radius:999px; border:0; background:var(--surface2); cursor:pointer; font-size:.95rem; }
.chip[aria-pressed=true] { background:var(--accent); color:var(--on-accent); font-weight:600; }
.picks { display:grid; gap:12px; margin-top:24px; }
.pick { display:flex; align-items:center; gap:16px; width:100%; min-height:84px; padding:16px 18px; text-align:left; border:0; border-radius:var(--r-md); background:var(--surface); box-shadow:0 0 0 1.5px var(--line),var(--shadow); cursor:pointer; }
.pick .ico { width:32px; height:32px; flex:none; display:grid; place-items:center; }
.pick .ico svg { width:26px; height:26px; }
.pick b { display:block; font:800 1.45rem/1 var(--display);  }
.pick .d { color:var(--muted); font-size:.9rem; }
.pick[aria-pressed=true] { background:var(--accent); color:var(--on-accent); box-shadow:none; }
.pick[aria-pressed=true] .d { color:color-mix(in srgb,var(--on-accent) 72%,transparent); }
.pick[aria-pressed=true] .ico { background:color-mix(in srgb,var(--on-accent) 14%,transparent); }
.swatches { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:24px; }
.sw { aspect-ratio:1; min-height:64px; border-radius:var(--r-md); border:0; cursor:pointer; }
.sw[aria-pressed=true] { box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--text); }
.tile { display:grid; place-items:center; width:56px; height:56px; flex:none; border-radius:16px; background:var(--accent); color:var(--on-accent); font:800 1.9rem/1 var(--display);  }
.tile.xl { width:96px; height:96px; border-radius:28px; font-size:3.6rem; }
.preview { display:flex; align-items:center; gap:18px; margin-top:28px; padding:18px; border-radius:var(--r-lg); background:var(--surface); }
.preview .nm { font:800 1.9rem/1 var(--display);  overflow-wrap:anywhere; }
.preview .sg { color:var(--muted); font-size:.92rem; margin-top:6px; overflow-wrap:anywhere; }

/* Hallmark · pre-emit critique: P4 H5 E4 S5 R4 V4
 * Nike reference: generous spacing, oversized type, flat surfaces. Existing app tokens retained. */
.app.landing { --shell:1200px; }
.welcome { flex:1; padding:20px 24px 40px; }
.wtop { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px; }
.mark { font:800 1.15rem var(--display); letter-spacing:-.04em; }
.wtop .acts { display:flex; align-items:center; gap:8px; }
.themebtn { min-height:44px; padding:8px 12px; border-radius:999px; border:0; background:var(--soft); color:var(--text); font:500 .85rem var(--sans); cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.themebtn i { width:16px; height:16px; border-radius:50%; background:conic-gradient(var(--bg) 0 50%,var(--text) 0); box-shadow:0 0 0 1.5px var(--text); }
.signin { min-height:44px; padding:8px 12px; border:0; background:transparent; color:var(--text); font:600 .85rem var(--sans); cursor:pointer; }
.landing-hero { display:grid; gap:36px; padding:60px 0 48px; }
.hero2 h1 { font:800 clamp(3.5rem,12vw,6.4rem)/.94 var(--display); letter-spacing:-.035em; margin:18px 0 24px; max-width:11ch; overflow-wrap:anywhere; }
.hero2 .sub { font-size:1.05rem; line-height:1.6; max-width:36ch; color:var(--muted); }
.hero2 .row { margin-top:28px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 24px; }
.welcome .cta { width:auto; padding:0 28px; background:var(--text); color:var(--bg); white-space:nowrap; }
.welcome .cta:hover, .signin:hover { opacity:.8; }
.textlink { display:inline-flex; align-items:center; min-height:44px; color:var(--text); font:600 .9rem var(--sans); text-underline-offset:5px; }
.fine { font:400 .8rem/1.5 var(--sans); color:var(--muted); }
.hero2 > .fine { margin-top:16px; }
.example { min-width:0; align-self:center; }
.example-nav { display:flex; border-bottom:1px solid var(--line); gap:18px; }
.example-nav button { padding:12px 0; min-height:44px; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; background:transparent; color:var(--muted); cursor:pointer; font:600 .86rem var(--sans); white-space:nowrap; }
.example-nav button[aria-pressed=true] { color:var(--text); border-bottom-color:var(--text); }
.example-stage { margin-top:18px; min-height:360px; background:var(--surface2); position:relative; padding:24px; display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
.example-stage .sample-label { color:var(--muted); font:600 .7rem var(--sans); text-transform:uppercase; letter-spacing:.12em; }
.sample-question { font:800 clamp(1.8rem,5vw,2.7rem)/1.12 var(--display); letter-spacing:-.035em; margin:28px 0 20px; text-wrap:balance; }
.sample-seats { display:flex; gap:8px; align-items:center; margin-top:22px; color:var(--muted); font-size:.78rem; flex-wrap:wrap; }
.sample-seats i { width:30px; height:30px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--text); font:600 .7rem var(--sans); font-style:normal; }
.example-stage .btn { align-self:flex-start; background:var(--surface); margin-top:12px; }
.sample-wave { width:100%; height:72px; color:var(--accent-text); margin:16px 0; }
.sample-quote { font:500 clamp(1.15rem,3vw,1.45rem)/1.5 var(--sans); margin:20px 0; }
.sample-transcript { background:var(--surface); border-left:3px solid var(--accent); padding:16px; font-size:.9rem; color:var(--text); }
.sample-transcript small { display:block; font-size:.7rem; color:var(--muted); margin-bottom:8px; }
.sample-spread { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); border:1px solid var(--line); margin-top:18px; background:var(--surface); min-height:270px; }
.sample-spread > div { padding:18px 14px; min-width:0; display:flex; flex-direction:column; }
.sample-spread > div + div { border-left:1px solid var(--line); }
.sample-spread h3 { font:800 clamp(1.5rem,4vw,2.2rem)/1 var(--display); letter-spacing:-.045em; margin:12px 0; overflow-wrap:anywhere; }
.sample-spread p { font:400 .7rem/1.7 var(--sans); }
.sample-spread .page-no { margin-top:auto; padding-top:16px; color:var(--muted); font-size:.6rem; }
.sample-spread .recipe { background:var(--accent); color:var(--on-accent); padding:14px; margin:12px 0; }
.sample-spread .recipe b { display:block; font:800 1.25rem/1 var(--display); margin-bottom:12px; }
.landing-how { display:grid; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.landing-how > div { padding:24px 0; }
.landing-how > div + div { border-top:1px solid var(--line); }
.landing-how .number { font:800 2.5rem/1 var(--num); color:var(--accent-text); }
.landing-how h2 { font:700 1.2rem var(--display); margin:12px 0 6px; letter-spacing:-.02em; }
.landing-how p { font-size:.92rem; color:var(--muted); max-width:32ch; }
.landing-games { display:grid; gap:28px; padding:60px 0; align-items:center; }
.welcome h2.section-title { font:800 clamp(2.2rem,6vw,3.7rem)/1.02 var(--display); letter-spacing:-.045em; max-width:15ch; margin:14px 0; overflow-wrap:anywhere; }
.landing-games p { color:var(--muted); max-width:38ch; }
.game-sample { padding:24px; background:var(--surface2); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:center; gap:20px; }
.game-sample svg { width:100%; height:auto; background:var(--surface); }
.game-sample b { font:800 1.5rem var(--display); display:block; }
.game-sample p { font-size:.8rem; margin:8px 0; }
.game-sample .fine { margin-top:16px; }
.future-note { border-top:1px solid var(--line); display:grid; gap:12px; padding:32px 0; }
.future-note h2 { font:700 1.3rem var(--display); letter-spacing:-.02em; }
.future-note p { color:var(--muted); font-size:.94rem; max-width:60ch; }
.faq { border-bottom:1px solid var(--line); margin-top:24px; }
.faq details { border-top:1px solid var(--line); }
.faq summary { cursor:pointer; list-style:none; padding:20px 0; font-weight:600; min-height:44px; display:flex; justify-content:space-between; gap:20px; }
.faq summary::-webkit-details-marker { display:none; }
.faq summary::after { content:"+"; color:var(--muted); }
.faq details[open] summary::after { content:"−"; }
.faq p { color:var(--muted); padding:0 0 20px; max-width:60ch; font-size:.92rem; }
.endcta { padding:60px 0; display:grid; gap:24px; justify-items:start; }
.foot { border-top:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; padding:20px 0 0; color:var(--muted); font-size:.8rem; }
.foot button, .foot a { background:none; border:0; padding:0; font:inherit; color:inherit; text-decoration:underline; cursor:pointer; min-height:44px; display:inline-flex; align-items:center; }
@media (min-width:768px) {
  .welcome { padding:28px 48px 36px; }
  .landing-hero { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; padding:80px 0 64px; }
  .hero2 h1 { font-size:clamp(3.5rem,6.5vw,6.4rem); }
  .landing-how { grid-template-columns:repeat(3,minmax(0,1fr)); gap:32px; }
  .landing-how > div + div { border-top:0; }
  .landing-games { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; padding:80px 0; }
  .future-note { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; }
}
@media (max-width:400px) { .game-sample { grid-template-columns:1fr; } .game-sample svg { width:180px; max-width:100%; } }
/* Profile settings: native disclosures keep personal details, preferences and data separate. */
.profile-settings { border-bottom:1px solid var(--line); }
.profile-settings > summary { min-height:64px; padding:20px 0; cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:16px; font:700 1.1rem var(--display); }
.profile-settings > summary::-webkit-details-marker { display:none; }
.profile-settings > summary::after { content:"+"; font:400 1.2rem var(--sans); color:var(--muted); }
.profile-settings[open] > summary::after { content:"−"; }
.profile-settings .fam { margin:0 0 28px; padding-top:0; border:0; }
.profile-settings .sec { font-size:1rem; }
/* sign in */
.authwrap { flex:1; display:flex; flex-direction:column; padding:max(16px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom)); max-width:460px; width:100%; margin:0 auto; }
.authwrap h1 { font:800 clamp(2.2rem,9vw,3rem)/1 var(--display); letter-spacing:-.025em; margin-top:28px; }
.authwrap .sub { color:var(--muted); margin-top:12px; }
.seg { display:grid; grid-template-columns:1fr 1fr; background:var(--soft); border-radius:999px; padding:4px; margin-top:24px; }
.seg button { min-height:44px; border:0; border-radius:999px; background:transparent; color:var(--muted); font:600 .95rem var(--sans); cursor:pointer; }
.seg button[aria-pressed=true] { background:var(--surface); color:var(--text); box-shadow:0 0 0 1px var(--line); }
.authwrap .cta { margin-top:22px; }
.authwrap .ghost { width:100%; margin-top:10px; background:transparent; }
.authwrap .msg { min-height:1.4em; margin-top:12px; color:var(--muted); font-size:.95rem; }
.authwrap .msg.bad { color:var(--danger); }
.authwrap .legal { margin-top:auto; padding-top:28px; color:var(--muted); font-size:.85rem; }
.authwrap .legal button { background:none; border:0; padding:0; font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }

/* room */
.roomwrap { flex:1; padding:max(12px,env(safe-area-inset-top)) 20px 120px; }
.rhead { display:flex; align-items:center; gap:14px; min-height:56px; }
.rhead .tile { width:48px; height:48px; border-radius:14px; font-size:1.6rem; }
.rhead .who { min-width:0; flex:1; }
.rhead .who b { display:block; font:800 1.25rem/1.05 var(--display);  overflow-wrap:anywhere; }
.rhead .who span { color:var(--muted); font-size:.85rem; }
.rhead .btn { flex:none; background:transparent; color:var(--muted); padding:10px 12px; }
.title { font:800 clamp(2.6rem,12vw,3.4rem)/.92 var(--display);  margin:20px 0 6px; }
.tabbar { position:fixed; left:50%; bottom:0; z-index:10; transform:translateX(-50%); width:min(100%,var(--shell)); display:grid; grid-template-columns:repeat(4,1fr); padding:6px 12px max(8px,env(safe-area-inset-bottom)); background:color-mix(in srgb,var(--bg) 84%,transparent); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); border-top:1px solid var(--line); }
.room ~ .tabbar { --shell:720px; }
.tabbtn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:54px; background:none; border:0; border-radius:14px; color:var(--muted); font:500 .72rem var(--sans); cursor:pointer; }
.tabbtn svg { width:24px; height:24px; }
.tabbtn[aria-selected=true] { color:var(--accent-text); }

/* the table */
.table { position:relative; isolation:isolate; display:grid; gap:14px 10px; margin:18px 0 24px; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-areas:"w1 st w2" "card card card" ". ask ."; align-items:start; }
.table::before { content:""; position:absolute; z-index:-1; inset:34px -6px 34px; border-radius:50%; background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 20%,transparent),transparent); border:1px solid var(--line); }
.seat { text-align:center; min-width:0; }
.s-ask { grid-area:ask; } .s-st { grid-area:st; } .s-w1 { grid-area:w1; } .s-w2 { grid-area:w2; }
.s-w1, .s-w2 { padding-top:18px; }
.table .whisper { grid-area:card; }
@media (min-width:640px){
  .table { grid-template-columns:112px minmax(0,1fr) 112px; grid-template-areas:". st ." "w1 card w2" ". ask ."; gap:14px 20px; }
  .table::before { inset:30px 36px; }
  .s-w1, .s-w2 { padding-top:0; align-self:center; }
}
.seat .av { position:relative; width:min(68px,100%); aspect-ratio:1; margin:0 auto 8px; border-radius:50%; display:grid; place-items:center; font:800 1.6rem/1 var(--display); background:color-mix(in srgb,var(--tint,var(--accent)) 42%,var(--surface2)); color:var(--text); }
.seat:not(.on) .av { background:transparent; box-shadow:inset 0 0 0 1.5px var(--line); color:var(--muted); }
.seat.on .av { box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line); background:var(--surface2); }
.seat .role { font:600 .78rem var(--sans); color:var(--accent-text); }
.seat .nm { font-size:.9rem; line-height:1.3; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.seat:not(.on) .nm { color:var(--muted); }
.seat .av::before, .seat .av::after { content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--accent); opacity:0; pointer-events:none; }
.seat .av::before { transition:opacity var(--t-mid) var(--ease-out); }
.seat.speaking .av::before { opacity:.6; }
.seat.speaking .av::after { animation:ripple 1.9s var(--ease-out) infinite; }
@keyframes ripple { from { transform:scale(.92); opacity:.55; } to { transform:scale(1.35); opacity:0; } }

.whisper { background:var(--surface); border-radius:var(--r-lg); padding:24px 22px 20px; box-shadow:0 0 0 1px var(--line),var(--shadow); }
.whisper small { font:600 .85rem var(--sans); color:var(--accent-text); }
.whisper .q { font:600 clamp(1.45rem,5.6vw,1.85rem)/1.2 var(--sans); letter-spacing:-.015em; margin:12px 0 18px; text-wrap:pretty; }
.whisper .warn { font-size:.9rem; color:var(--danger); margin:-6px 0 16px; }
.whisper .hint { margin:0; }
.whisper .row { display:flex; margin-top:16px; }
.whisper .btn.skip { background:transparent; color:var(--muted); padding-left:0; }
.whisper .chip[aria-pressed=true] { background:var(--surface2); color:var(--muted); font-weight:500; box-shadow:0 0 0 1px var(--line),var(--shadow); }
.card { background:var(--surface); border-radius:var(--r-lg); padding:20px; margin-top:16px; }
.card h3 { font:800 1.3rem/1.05 var(--display);  margin-bottom:12px; }
.recbar { display:flex; align-items:center; gap:16px; }
.rec { position:relative; width:76px; height:76px; flex:none; border-radius:50%; border:0; background:var(--accent); color:var(--on-accent); font:700 .82rem var(--sans); cursor:pointer; }
.rec::after { content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--accent); opacity:0; pointer-events:none; }
.rec.live::after { animation:ripple 1.4s var(--ease-out) infinite; }
.recbar b { display:block; font-weight:600; }
.clip { margin-top:14px; } .clip audio { width:100%; margin-top:6px; }
.eras { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -20px; padding:0 20px 4px; scrollbar-width:none; }
.eras::-webkit-scrollbar { display:none; }
.era { flex:0 0 min(72%,260px); scroll-snap-align:start; padding:14px 16px; border-radius:var(--r-md); background:var(--surface2); }
.era b { display:block; font:800 2.2rem/1 var(--num); color:var(--accent-text); }
.note { font-size:.8rem; color:var(--muted); margin-top:28px; }

/* make */
.lede { margin-top:8px; font-size:1.05rem; }
.lede b { font:800 2rem/1 var(--num); color:var(--accent-text); margin-right:6px; }
.ticks { display:flex; gap:4px; margin-top:12px; }
.ticks i { width:26px; height:4px; background:var(--line); }
.ticks i.on { background:var(--accent); }
.works { list-style:none; margin:24px 0 0; padding:0; border-bottom:1px solid var(--line); }
.work { display:grid; grid-template-columns:104px minmax(0,1fr); gap:18px; padding:20px 0; border-top:1px solid var(--line); align-items:start; }
.work h3 { margin:0; font:800 1.3rem/1.1 var(--display); letter-spacing:-.01em; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.work .chosen { font:600 .85rem var(--sans); color:var(--accent-text); }
.work p { color:var(--muted); font-size:.92rem; margin:6px 0 0; }
.work .btn { margin-top:12px; }
.thumb { position:relative; overflow:hidden; min-width:0; min-height:0; padding:9px; display:flex; flex-direction:column; justify-content:flex-end; border-radius:4px; }
.thumb b { font:800 .95rem/1 var(--display); letter-spacing:-.01em; overflow-wrap:anywhere; }
.thumb small { font:600 .64rem var(--sans); opacity:.75; margin-bottom:auto; }
.thumb.mag { aspect-ratio:3/4; background:var(--accent); color:var(--on-accent); }
.thumb.book { aspect-ratio:1; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); color:var(--text); }
.thumb.book i { display:block; height:2px; background:var(--line); margin-top:4px; }
.thumb.film { height:66px; background:#1d1d1f; color:#fff7ea; }
.thumb.film::before { content:""; position:absolute; left:9px; top:9px; width:18px; height:18px; border-radius:50%; background:#fff7ea; }
.thumb.film::after { content:""; position:absolute; left:15px; top:14px; border-left:6px solid #1d1d1f; border-top:4px solid transparent; border-bottom:4px solid transparent; }
.miles { list-style:none; margin:12px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:0 28px; }
.miles li { display:flex; align-items:center; gap:12px; padding:13px 0; border-top:1px solid var(--line); font-size:.95rem; color:var(--muted); }
.miles li.on { color:var(--text); }
.miles li::before { content:""; width:16px; height:16px; flex:none; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--muted); }
.miles li.on::before { background:var(--accent); box-shadow:none; }
@media (max-width:380px){ .miles { grid-template-columns:1fr; } }

/* season poster + sheets + recording run screen */
.btn.wide { width:100%; margin-top:16px; }
body.lock { overflow:hidden; }
.sheetback { position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center; background:var(--scrim); transition:opacity var(--t-mid) var(--ease-out); }
.sheet { width:min(100%,560px); max-height:90vh; max-height:90dvh; overflow:auto; background:var(--surface); border-radius:var(--r-lg) var(--r-lg) 0 0; padding:10px 22px max(24px,env(safe-area-inset-bottom)); transition:transform var(--t-slow) var(--ease-out), opacity var(--t-slow) var(--ease-out); }
.sheet:focus { outline:0; }
.grab { width:40px; height:5px; border-radius:5px; background:var(--line); margin:0 auto 16px; }
.sheet h2 { font:800 2.1rem/.95 var(--display);  }
.thumbs { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0 4px; }
.thumb { min-height:84px; border:0; border-radius:var(--r-md); background:var(--surface2); font:800 1.7rem/1 var(--display);  cursor:pointer; transition:transform var(--t-mid) var(--ease-out); }
.thumb:active { transform:scale(.97); }
.thumb[aria-pressed=true] { background:var(--accent); color:var(--on-accent); }
.rov { position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; padding:max(20px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom)); background:var(--accent); color:var(--on-accent); transition:opacity var(--t-mid) var(--ease-out); }
.rov .cd { flex:1; display:grid; place-items:center; font:800 clamp(12rem,62vw,24rem)/.8 var(--num); }
.rov .rtop { display:flex; align-items:center; gap:12px; min-height:56px; }
.rov .rtop .av { width:48px; height:48px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:#fff7ea; font:800 1.5rem/1 var(--display);  }
.rov .rtop b { display:block; font:800 1.4rem/1 var(--display);  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rov .rtop span { font-size:.8rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
.rov .rtop > div { min-width:0; }
.rov .timer { flex:1; display:grid; place-items:center; font:800 clamp(6.5rem,32vw,13rem)/.85 var(--num); font-variant-numeric:tabular-nums; }
.rov .rq { font:600 1.15rem/1.3 var(--sans); max-width:34ch; margin:0 auto 24px; text-align:center; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.rov .stop { width:88px; height:88px; margin:0 auto; border-radius:50%; border:0; background:var(--ink); color:#fff7ea; display:grid; place-items:center; cursor:pointer; transition:transform var(--t-mid) var(--ease-out); }
.rov .stop:active { transform:scale(.95); }
.rov .stop i { width:28px; height:28px; border-radius:7px; background:currentColor; }
.rov .quiet { background:none; border:0; min-height:44px; font-weight:600; text-decoration:underline; cursor:pointer; color:inherit; margin:0 auto; }
.rov :focus-visible { outline-color:var(--ink); }

/* badges + previews */
.sec { font:800 1.5rem/1 var(--display); letter-spacing:-.01em; margin:40px 0 4px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.sec .cnt { font:500 .9rem var(--sans); color:var(--muted); letter-spacing:0; }
.pv { display:flex; gap:10px; margin-top:12px; }
.pager { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; margin:16px -22px 0; padding:0 22px 8px; scrollbar-width:none; }
.pager::-webkit-scrollbar { display:none; }
.pg { flex:0 0 78%; scroll-snap-align:center; aspect-ratio:4/5; border-radius:20px; padding:20px; display:flex; flex-direction:column; justify-content:space-between; background:var(--surface2); position:relative; overflow:hidden; }
.pg.cv { background:#2b2540; color:#fff7ea; }
.pg small { font:600 .85rem var(--sans); color:var(--accent-text); }
.pg b { font:800 2rem/.95 var(--display);  overflow-wrap:anywhere; position:relative; }
.pg p { color:var(--muted); font-size:.92rem; position:relative; max-width:22ch; }
.pg .q { color:var(--text); font:600 1.05rem/1.25 var(--sans); }
.pg .ans { max-width:none; color:var(--text); font-size:.92rem; line-height:1.4; display:-webkit-box; -webkit-line-clamp:9; -webkit-box-orient:vertical; overflow:hidden; }
.cvs { display:block; width:100%; height:auto; border-radius:16px; margin-top:16px; }
.reel { position:relative; aspect-ratio:16/9; margin-top:16px; border-radius:16px; overflow:hidden; background:#1d1d1f; color:#fff7ea; }
.reel div { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:0 12px; font:800 clamp(1.8rem,9vw,3rem)/.95 var(--display);  opacity:0; overflow-wrap:anywhere; animation:life 2.4s var(--ease-out) both; animation-delay:calc(var(--i) * 2.4s); }
.reel div.sm { font-size:clamp(1rem,4.5vw,1.3rem); font-family:var(--sans); font-weight:500; color:var(--accent); }
@keyframes life { 0% { opacity:0; transform:scale(.96); } 14%,78% { opacity:1; transform:none; } 100% { opacity:0; transform:scale(1.02); } }


/* sit */
.smeta { margin-top:2px; }
.smeta p { color:var(--muted); font-size:.95rem; }
.whisper { padding:22px 20px 18px; }
.whisper small { display:block; }
.whisper .q { font:600 clamp(1.5rem,6vw,1.95rem)/1.18 var(--sans); letter-spacing:-.02em; margin:8px 0 10px; }
.tip { color:var(--muted); font-size:.95rem; margin:0 0 14px; }
.fus { display:grid; gap:0; margin:6px 0 18px; border-top:1px solid var(--line); }
.fu { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:44px; padding:10px 0; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); color:var(--text); font-size:.98rem; cursor:pointer; }
.fu::after { content:""; width:16px; height:16px; flex:none; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--muted); }
.fu[aria-pressed=true] { color:var(--muted); text-decoration:line-through; }
.fu[aria-pressed=true]::after { background:var(--accent); box-shadow:none; }
.whisper .cta { margin-top:4px; }
.rs { min-height:1.4em; margin-top:12px; color:var(--muted); font-size:.92rem; text-align:center; }
.whisper .btn.skip { display:block; margin:6px auto 0; padding:10px 8px; }
.clips { list-style:none; margin:8px 0 0; padding:0; border-bottom:1px solid var(--line); }
.clips li { padding:16px 0; border-top:1px solid var(--line); }
.cq { font-weight:600; margin-bottom:8px; }
.clips audio { width:100%; height:40px; }
.cm { display:flex; align-items:center; gap:16px; margin-top:8px; color:var(--muted); font-size:.88rem; }
.cm a, .lnk { color:var(--accent-text); background:none; border:0; padding:6px 0; font:inherit; font-weight:600; text-decoration:underline; cursor:pointer; }
.cm .lnk { margin-left:auto; color:var(--danger); }
.eras2 { list-style:none; margin:8px 0 0; padding:0; border-bottom:1px solid var(--line); }
.eras2 li { display:grid; grid-template-columns:64px 1fr; gap:2px 14px; padding:14px 0; border-top:1px solid var(--line); }
.eras2 b { grid-row:1/3; font:800 1.7rem/1 var(--num); color:var(--accent-text); }
.eras2 em { font-style:normal; color:var(--muted); font-size:.88rem; }

/* transcripts */
.tx { margin-top:10px; }
.txt { width:100%; padding:10px 12px; font:400 1rem/1.5 var(--sans); color:var(--text); background:var(--surface2); border:0; border-radius:8px; resize:none; overflow:hidden; }
.txt:focus { outline:2px solid var(--accent); outline-offset:1px; }
.txs { color:var(--muted); font-size:.85rem; margin-top:6px; }
.txs.err { color:var(--danger); }
select.inp { appearance:none; padding-right:28px; background:transparent; border-radius:0; }
/* family */
.fam .field:first-of-type { margin-top:18px; }
.facts { list-style:none; margin:14px 0 0; padding:0; border-bottom:1px solid var(--line); }
.facts li { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:13px 0; border-top:1px solid var(--line); }
.facts span { color:var(--muted); }
.facts b { font:800 1.3rem/1 var(--num); }
.para { color:var(--muted); font-size:.95rem; margin-top:10px; max-width:52ch; }
.btn.danger { color:var(--danger); }

/* online rooms */
.rtop2 { display:flex; align-items:center; gap:10px; margin-top:8px; }
.rcode { flex:1; min-width:0; }
.rcode small { display:block; font:600 .85rem var(--sans); color:var(--muted); }
.rcode b { display:block; font:800 clamp(2.6rem,13vw,3.6rem)/.9 var(--num); letter-spacing:.1em; color:var(--accent-text); }
.members { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.member { display:inline-flex; align-items:center; gap:8px; max-width:100%; padding:8px 14px; border-radius:999px; background:var(--surface); font-size:.9rem; }
.member.you { box-shadow:inset 0 0 0 1.5px var(--accent); }
.member span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.member em { font-style:normal; color:var(--muted); font-size:.78rem; }
.dot { width:8px; height:8px; flex:none; border-radius:50%; background:#cdbfae; }
.dot.on { background:#2fb36b; }
.onl { margin-top:20px; }
.onl .row2 { display:flex; gap:10px; margin-top:12px; }
.onl .row2 .inp { flex:1; min-width:0; text-transform:uppercase; letter-spacing:.14em; }
.guest { padding:max(16px,env(safe-area-inset-top)) 22px 40px; }
.guest .mark { margin-bottom:18px; }
.err { color:var(--danger); font-size:.9rem; min-height:1.4em; margin-top:8px; }
.pit.cap { box-shadow:inset 0 0 0 2px #fff; }

/* whot rules */
.fixed { margin:8px 0 0; padding:0; }
.fixed li { display:flex; gap:14px; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--line); list-style:none; font-size:.95rem; }
.fixed b { flex:none; min-width:62px; font:800 1.35rem/1 var(--num); text-transform:uppercase; color:var(--accent-text); }
.rule { display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
.rule .t { flex:1; min-width:0; }
.rule .t b { display:block; font-weight:600; }
.rule .t span { color:var(--muted); font-size:.88rem; }
.tg { position:relative; flex:none; width:60px; height:44px; padding:0; border:0; background:none; cursor:pointer; }
.tg::before { content:""; position:absolute; left:4px; top:7px; width:52px; height:30px; border-radius:30px; background:var(--surface2); box-shadow:0 0 0 1px var(--line),var(--shadow); }
.tg::after { content:""; position:absolute; left:8px; top:11px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px #00000040; transition:transform var(--t-mid) var(--ease-out); }
.tg[aria-checked=true]::before { background:var(--accent); box-shadow:none; }
.tg[aria-checked=true]::after { transform:translateX(22px); background:#fff; }
.rulebtn { margin-left:auto; flex:none; background:transparent; color:var(--muted); padding:6px 12px; min-height:44px; }

/* whot */
.whot .scores { display:flex; gap:6px 18px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.whot .scores span { padding:0 0 4px; border-bottom:2px solid transparent; font-size:.9rem; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.whot .scores span.on { color:var(--text); font-weight:600; border-bottom-color:var(--accent); }
.piles { display:flex; justify-content:center; align-items:center; gap:20px; margin:20px 0 4px; }
.wc { position:relative; flex:none; width:68px; height:98px; padding:0; border:0; border-radius:8px; background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--text); display:grid; place-items:center; cursor:pointer; transition:transform var(--t-mid) var(--ease-out), opacity var(--t-mid); }
.wc.big { width:100px; height:144px; border-radius:10px; cursor:default; }
.wc svg { width:52%; height:auto; }
.wc .n { position:absolute; top:6px; left:8px; font:800 1.1rem/1 var(--num); }
.wc .n.b { top:auto; left:auto; bottom:6px; right:8px; transform:rotate(180deg); }
.wc.circle svg { color:#e5484d; } .wc.triangle svg { color:#e0a800; } .wc.cross svg { color:#3e63dd; } .wc.square svg { color:#30a46c; } .wc.star svg { color:#9b5de5; }
.wc.whot { background:#1d1d1f; color:#fff7ea; box-shadow:inset 0 0 0 2px var(--accent); }
.wc.whot b { font:800 .95rem/1 var(--num); letter-spacing:.12em; color:var(--accent); }
.wc.back { background:repeating-linear-gradient(135deg,var(--accent) 0 7px,color-mix(in srgb,var(--accent) 82%,var(--on-accent)) 7px 9px); color:var(--on-accent); box-shadow:inset 0 0 0 1.5px var(--text); font:800 1.5rem/1 var(--display); }
.wc.back small { position:absolute; bottom:8px; font:700 .62rem var(--sans); letter-spacing:.12em; }
.wc.can { box-shadow:inset 0 0 0 2px var(--accent),0 4px 0 var(--accent); transform:translateY(-8px); }
.wc.no { opacity:.4; cursor:default; }
button.wc:not(.big):not(.no):active { transform:scale(.96); }
.hand { display:flex; gap:8px; overflow-x:auto; padding:16px 4px 14px; margin:0 -4px; scroll-snap-type:x proximity; }
.hand .wc { scroll-snap-align:start; }
.need { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:.95rem; margin-top:10px; }
.need svg { width:18px; height:18px; }
.need.circle svg { color:#e5484d; } .need.triangle svg { color:#e0a800; } .need.cross svg { color:#3e63dd; } .need.square svg { color:#30a46c; } .need.star svg { color:#9b5de5; }
.gate { margin-top:24px; padding:28px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); text-align:left; }
.gate b { display:block; font:800 clamp(2.4rem,11vw,3.4rem)/.92 var(--display);  overflow-wrap:anywhere; }
.gate p { color:var(--muted); margin:12px 0 22px; }
.shapes { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px; }
.shapes button { min-height:64px; border:0; border-radius:8px; background:var(--surface2); display:grid; place-items:center; cursor:pointer; }
.shapes button svg { width:30px; height:30px; }
.shapes .circle svg { color:#e5484d; } .shapes .triangle svg { color:#e0a800; } .shapes .cross svg { color:#3e63dd; } .shapes .square svg { color:#30a46c; } .shapes .star svg { color:#9b5de5; }

/* ayo */
.ayo .store { display:flex; gap:24px; margin:12px 0 18px; }
.score { flex:1; min-width:0; padding:0 0 10px; border-bottom:2px solid var(--line); }
.score b { display:block; font:800 2.6rem/.95 var(--num); }
.score span { display:block; font-size:.88rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.score.on { border-bottom-color:var(--accent); }
.apits { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; }
.rowlbl { grid-column:1/-1; font-size:.88rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rowlbl.on { color:var(--text); font-weight:600; }
.pit { position:relative; display:block; aspect-ratio:1; min-height:44px; padding:0; border-radius:50%; border:0; background:var(--surface2); box-shadow:inset 0 0 0 1.5px var(--line); color:var(--text); cursor:default; transition:transform var(--t-mid) var(--ease-out); }
.pit.b { background:color-mix(in srgb,var(--surface2) 78%,var(--text) 10%); }
.pit .sd { position:absolute; width:15%; aspect-ratio:1; border-radius:50%; background:var(--text); opacity:.82; transform:translate(-50%,-50%); }
.pit .ct { position:absolute; right:9%; bottom:5%; font:700 .74rem var(--sans); color:var(--muted); }
.pit.can { cursor:pointer; box-shadow:inset 0 0 0 2px var(--accent); }
.pit.can:active { transform:scale(.95); }
.pit.hit { background:var(--accent); }
.pit.hit .sd { background:var(--on-accent); opacity:1; }
.pit.hit .ct { color:var(--on-accent); }
.pit:disabled { opacity:1; }
.pit.zero .ct { opacity:.45; }
.pit.cap { box-shadow:inset 0 0 0 2px var(--text); }
.gback { margin:8px 0 0 -8px; background:none; color:var(--muted); }
.pickrow { margin-top:20px; }

/* stats + leaderboard (Activity / Challenge patterns) */
.stat { display:flex; align-items:flex-end; gap:14px; margin:18px 0 6px; }
.stat b { font:800 clamp(5.5rem,30vw,8.5rem)/.78 var(--num); color:var(--accent-text); letter-spacing:-.01em; }
.stat span { padding-bottom:6px; color:var(--muted); font-size:.95rem; max-width:18ch; }
.lb { margin-top:24px; }
.lb h2 { font:800 1.6rem/1 var(--display);  margin-bottom:6px; }
.lb li { display:flex; align-items:center; gap:16px; min-height:56px; border-bottom:1px solid var(--line); list-style:none; }
.lb ol { margin:0; padding:0; }
.lb .rk { width:32px; font:800 1.8rem/1 var(--num); color:var(--muted); }
.lb li:first-child .rk { color:var(--accent-text); }
.lb .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.lb .ct { font:800 1.4rem/1 var(--num); }

/* play + ludo */
.games { display:grid; gap:0; margin-top:20px; border-bottom:1px solid var(--line); }
.game { display:flex; align-items:center; gap:16px; width:100%; min-height:84px; padding:16px 0; text-align:left; border:0; border-top:1px solid var(--line); border-radius:0; background:none; color:var(--text); cursor:pointer; }
.game:disabled { opacity:.5; cursor:default; }

<script>
"use strict";
/* ---------- state ---------- */

const lum = (hex) => { const c = [1, 3, 5].map((i) => { const v = parseInt(hex.slice(i, i + 2), 16) / 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const contrast = (a, b) => (Math.max(a, b) + .05) / (Math.min(a, b) + .05);
const onAccent = (hex) => contrast(lum(hex), lum("#2b1a12")) >= contrast(lum(hex), 1) ? "#2b1a12" : "#ffffff"; // whichever of dark or white reads better on this accent
const blank = { step: 0, me: { name: "" }, consent: { transcribe: false }, autoTx: false, lang: "", hints: "", name: "", saying: "", color: "#e26b3f", town: "", heritage: [], makes: [], chapters: ["names", "home", "food"], elder: { name: "", born: "" }, seats: [], asked: [], told: 0, wins: [], sittings: [], whotRules: { stack: false, pickSkips: true, marketAgain: true, noPowerFinish: false, whotBlock: false, passSuspend: false, lastCard: false, hand: 0 } };
const fresh = () => structuredClone(blank);
// Dev only (localhost): ?data=worst|empty|one|demo swaps in a fixture (never saved). &step=N picks the screen.
const QS = new URLSearchParams(location.search);

function backupControls(parent, allowDownload = true) {

  const restore = $(`<label class="field"><span class="lbl">Restore backup</span><input type="file" accept=".json,application/json" style="display:block;max-width:100%;margin-top:12px"></label>`);
  const status = $(`<p class="err" role="status"></p>`);
  download.onclick = async () => {
    download.disabled = true; status.textContent = "Preparing backup…";
    try { const text = await createBackup(); downloadFile(new Blob([text], { type: "application/json" }), "tell-me-again-backup.json"); status.textContent = "Backup downloaded."; }
    catch (e) { status.textContent = e.message; } finally { download.disabled = false; }
  };
  restore.querySelector("input").onchange = async e => {
    const file = e.target.files[0]; if (!file) return; e.target.value = ""; status.textContent = "";
    try {
      if (file.size > BACKUP_LIMIT) throw new Error("Choose a backup smaller than 128 MB.");
      const backup = parseBackup(await file.text());
      const b = $(`<div><h2>Restore ${esc(backup.family.name || "family")}?</h2><p class="para" style="margin:16px 0">${backup.recordings.length} recordings. Replaces the family details and recordings on this device. Download a backup first if you want to keep them.</p><button class="cta" type="button">Replace and restore</button><p role="status" class="err"></p></div>`);
      const close = sheet("Restore family backup", b); b.append(closeBtn(close));
      b.querySelector(".cta").onclick = async e => {
        e.currentTarget.disabled = true;
        try { await restoreBackup(backup); close(); }
        catch (error) { b.querySelector(".err").textContent = error.message; b.querySelector(".cta").disabled = false; }
      };
    } catch (error) { status.textContent = error.message || "This backup couldn't be read."; }
  };
  if (allowDownload) parent.append(download);
  parent.append(restore, status);
}

// Ask once, plainly, before any audio leaves the device.
function askTxConsent() {
  return new Promise((res) => {
    const b = $(`<div><h2>Turn recordings into text?</h2>
      <p class="para" style="margin-top:10px">The audio goes to Cloudflare's speech-to-text service and the words come back. Neither of us keeps the audio. Turn it off any time under Family. <a href="#" id="pv">Privacy</a></p>
      <button class="cta" id="ok" type="button" style="margin-top:20px">Yes, turn it into text</button>
      <button class="btn" id="no" type="button" style="width:100%;margin-top:8px;background:transparent;color:var(--muted)">Not now</button></div>`);
    let done = false; const close = sheet("Turn recordings into text?", b);
    b.querySelector("#ok").onclick = () => { done = true; grantConsent("transcribe"); close(); res(true); };
    b.querySelector("#no").onclick = () => { close(); res(false); };
    b.querySelector("#pv").onclick = (e) => { e.preventDefault(); privacySheet(); };
    new MutationObserver((_, ob) => { if (!document.body.contains(b)) { ob.disconnect(); if (!done) res(false); } }).observe(document.body, { childList: true, subtree: true });
  });
}

// Recording permission belongs to the person speaking, separately from transcription permission.
function recordingPermission(consequence) {
  return new Promise(resolve => {
    const body = $(`<div><h2>Allow this recording?</h2><p class="para" style="margin:16px 0">${esc(consequence)}</p><label style="display:flex;gap:12px;align-items:flex-start;margin:20px 0"><input type="checkbox" style="margin-top:5px"><span>Everyone being recorded is 16 or older, or has a parent or guardian present and agreeing.</span></label><button class="cta" type="button" disabled>Allow recording</button><button class="btn" type="button" style="width:100%;margin-top:12px">Not now</button></div>`);
    let settled = false;
    const close = sheet("Recording permission", body);
    const finish = value => { if (settled) return; settled = true; close(); resolve(value); };
    const allow = body.querySelector(".cta");
    body.querySelector("input").onchange = e => { allow.disabled = !e.target.checked; };
    allow.onclick = () => { if (!allow.disabled) finish(true); };
    body.querySelector(".btn").onclick = () => finish(false);
    const observer = new MutationObserver(() => { if (!body.isConnected) { observer.disconnect(); finish(false); } });
    observer.observe(document.body, { childList: true, subtree: true });
  });
}

const ROLES = ["Asker", "Storyteller", "Witness", "Witness"];
const SEAT_CLS = ["s-ask", "s-st", "s-w1", "s-w2"];
function nextQuestion() {
  const pool = QUESTIONS.filter((q) => S.chapters.includes(q.c));
  const n = S.asked.length, maxD = n < 2 ? 1 : n < 4 ? 2 : n < 6 ? 3 : 4; // ease in: warm-up first
  const fresh = pool.filter((q) => !S.asked.includes(q.q) && q.d <= maxD).sort((a, b) => a.d - b.d);
  return fresh[0] || pool.find((q) => !S.asked.includes(q.q)) || null;
}

// 3-2-1, then a full-screen run screen: the family colour, a huge timer, one big stop button. Resolves with the overlay or null if cancelled.
function countdown() {
  return new Promise((res) => {
    const ov = $(`<div class="rov" role="dialog" aria-modal="true" aria-label="Recording starts soon"><div class="cd" aria-live="assertive">3</div><button class="quiet" type="button">Cancel</button></div>`);
    document.body.append(ov); document.body.classList.add("lock");
    const cd = ov.querySelector(".cd"); let n = 3, t;
    const tick = () => { if (n === 0) { res(ov); return; } cd.textContent = n; if (!reduceMotion()) cd.animate([{ transform: "scale(.7)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 260, easing: "cubic-bezier(.23,1,.32,1)" }); n--; t = setTimeout(tick, 900); };
    ov.querySelector(".quiet").onclick = () => { clearTimeout(t); ov.remove(); document.body.classList.remove("lock"); res(null); };
    ov.querySelector(".quiet").focus(); tick();
  });
}
function runScreen(ov, who, q, onStop) {
  ov.setAttribute("aria-label", "Recording");
  ov.innerHTML = `<div class="rtop"><div class="av" aria-hidden="true">${esc(initial(who))}</div><div><span>Recording</span><b>${esc(who)}</b></div></div>
    <div class="timer" role="timer" aria-label="Elapsed time">0:00</div>
    <p class="rq">${q ? esc(q) : "Tell it your way."}</p>
    <button class="stop" type="button" aria-label="Stop recording"><i></i></button>`;
  const tm = ov.querySelector(".timer"), t0 = Date.now();
  const iv = setInterval(() => { const sec = Math.floor((Date.now() - t0) / 1000); tm.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }, 250);
  const stop = ov.querySelector(".stop"); stop.onclick = onStop; stop.focus();
  return () => { clearInterval(iv); ov.remove(); document.body.classList.remove("lock"); };
}

// One recording: the audio, then its words (or the way to get them), then Save and Delete.
function clipRow(c, box) {
  const li = $(`<li><div class="cq">${esc(c.q)}</div><audio controls preload="metadata" src="${c.url}"></audio>${c._unsaved ? `<p class="err save-warning">Not saved to this device. Save the audio or download a backup before leaving.</p>` : ""}<div class="tx"></div>
    <div class="cm"><span>${new Date(c.at).toLocaleDateString(undefined, { day: "numeric", month: "short" })} · ${fmtDur(c.dur || 0)}</span><a href="${c.url}" download="tell-me-again-${new Date(c.at).toISOString().slice(0, 10)}.webm">Save audio</a><button class="lnk" type="button">Delete</button></div></li>`);
  const tx = li.querySelector(".tx"); let saveT;
  const paint = () => {
    tx.replaceChildren();
    if (!c._unsaved) li.querySelector(".save-warning")?.remove();
    li.querySelector(".lnk").disabled = txBusy.has(c.id);
    if (txBusy.has(c.id)) { tx.append($(`<p class="txs" role="status">Turning it into text. A short answer takes under half a minute; a long one can take a couple of minutes.</p>`)); tx.setAttribute("aria-busy", "true"); return; }
    tx.removeAttribute("aria-busy");
    if (c.text === undefined) {
      const b = $(`<button class="btn" type="button">Turn into text</button>`); b.onclick = () => run(); tx.append(b);
    } else if (!c.text.trim() && !c._typing) {
      tx.append($(`<p class="txs">We couldn't hear any speech in this one. Try again, or type what they said.</p>`));
      const b = $(`<button class="btn" type="button" style="margin-right:8px">Try again</button>`); b.onclick = () => run();
      const t = $(`<button class="btn" type="button">Type it myself</button>`); t.onclick = () => { c._typing = true; paint(); tx.querySelector("textarea").focus(); };

function mountRoom(box, code, name, onLeave) {
  const pid = myPid(); let ws, st = null, dead = false, tries = 0, errT, stage = null;
  box.replaceChildren($(`<div class="room2"><div class="rtop2"><div class="rcode"><small>Room</small><b>${esc(code)}</b></div>
    <button class="btn" id="sh" type="button">Share</button><button class="btn" id="lv" type="button">Leave</button></div>
    <div class="members" id="mem" aria-label="Who's here"></div><p class="err" id="er" role="status"></p><div id="voice2"></div><div id="stage2"></div></div>`));
  const er = box.querySelector("#er"), stg = box.querySelector("#stage2");
  const note = (m, ms = 3500) => { er.textContent = m; clearTimeout(errT); if (ms) errT = setTimeout(() => er.textContent = "", ms); };
  const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  box.querySelector("#sh").onclick = async () => { const m = await shareRoom(code); if (m) note(m); };
  let leaving = null;
  const leave = (forget = true) => {
    if (leaving) return leaving;
    leaving = (async () => {
      dead = true; clearTimeout(errT);
      send({ t: "sig", d: JSON.stringify({ k: "bye" }) });
      try { await voice.end(); } catch {} try { ws && ws.close(); } catch {}
      if (currentRoom === session) currentRoom = null;
      if (forget) { lsSet("sitting-room", ""); onLeave(); }
    })();
    return leaving;
  };
  const voice = voiceSitting(box.querySelector("#voice2"), send, () => (st && st.me && st.me.name) || name, note);
  box.querySelector("#lv").onclick = () => leave();

  function connect() {
    if (dead) return;
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/rooms/${code}/ws`);
    ws.onopen = () => { tries = 0; send({ t: "join", pid, name }); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch { return; } if (m.t === "state") { st = m; paintRoom(); } else if (m.t === "sig") voice.onSig(m.d); else if (m.t === "err") note(m.m); };
    ws.onclose = () => { if (dead) return; note("Reconnecting…", 0); setTimeout(connect, Math.min(1000 * 2 ** tries++, 8000)); };
  }
  function paintRoom() {
    if (er.textContent === "Reconnecting…") er.textContent = "";
    box.querySelector("#mem").replaceChildren(...st.members.map((m) => $(`<span class="member ${m.you ? "you" : ""}"><i class="dot ${m.online ? "on" : ""}"></i><span>${esc(m.name)}</span><em>${m.host ? "host" : m.seat < 0 ? "watching" : ""}${m.wins ? ` · ${m.wins} ${m.wins === 1 ? "win" : "wins"}` : ""}</em></span>`)));
    const g = st.game;
    if (!g) { stage = null; return lobby(); }
    if (!stage || stage.id !== g.id) { stg.replaceChildren(); stage = { id: g.id, ...mountOnlineGame(g.kind, stg, send, st, note) }; }
    stage.update(g, st);
    if (g.v.over !== null) stg.querySelectorAll(".endg").forEach((x) => x.remove());
    if (st.me && st.me.host && g.v.over === null && !stg.querySelector(".endg")) { // the host can always call a game off
      const b = $(`<button class="btn endg" type="button" style="margin-top:20px;background:transparent;color:var(--muted)">End this game</button>`);
      b.onclick = () => { if (confirm("End this game for everyone?")) send({ t: "stop" }); }; stg.append(b);
    }
  }
  function lobby() {
    const seated = st.members.filter((m) => m.seat >= 0).length, host = st.me && st.me.host;
    const el = $(`<div class="onl"><h2 class="sec" style="margin-top:8px">${host ? "Pick a game" : "Waiting for the host"}</h2>
      <p class="hint">${seated} ${seated === 1 ? "person" : "people"} at the table</p><div class="games"></div></div>`);
    if (host) {
      const games = [["ludo", "6", "Ludo", "2 to 4 players"], ["ayo", "12", "Ayo", "2 play, the rest watch"], ["whot", "20", "Whot", "2 to 4 players"]];
      games.forEach(([k, g, t, d]) => { const b = $(`<button class="game" type="button"><span class="g">${g}</span><span><b>${t}</b><span class="d">${d}</span></span></button>`);
        b.disabled = seated < 2; b.onclick = () => send({ t: "start", game: k, rules: k === "whot" ? S.whotRules : undefined }); el.querySelector(".games").append(b); });
      const hr = $(`<button class="btn" type="button" style="margin-top:12px">Whot house rules</button>`);
      hr.onclick = () => { const b = $(`<div><h2>Whot house rules</h2></div>`); whotRuleRows(b); b.append(closeBtn(sheet("Whot house rules", b))); };
      el.append(hr);
    }
    stg.replaceChildren(el);
  }
  const session = { close: leave };
  currentRoom = session;
  connect();
  return session;
}

      const at = {}; v.pl.forEach((p) => p.t.forEach((q, i) => { if (q >= 0 && q < 56) (at[p.k + ":" + q] = at[p.k + ":" + q] || []).push(i); }));

  const el = $(`<div class="card onl"><h3>Play online</h3>
